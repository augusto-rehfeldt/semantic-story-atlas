<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelfscape</title>
    <meta name="description" content="Map and search a book library by meaning.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Status Message Banner -->
    <div class="status-message" id="statusMessage" role="status" aria-live="polite"></div>

    <div class="app-container">
        <!-- Left Panel: Graph -->
        <div class="graph-panel">
            <div class="graph-container">
                <canvas id="embeddingGraph"></canvas>
                <div id="zoomIndicator" class="graph-zoom-indicator" aria-hidden="true">
                    <span class="graph-mode-icon">🔎</span>
                    <span class="graph-mode-text" id="zoomIndicatorText">100%</span>
                    <span class="graph-mode-hint">dbl</span>
                </div>
                <div class="graph-legend">
                    <div class="legend-item">
                        <span class="legend-dot story-dot"></span>
                        <span>Stories</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot query-dot"></span>
                        <span>Your Query</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot selected-dot"></span>
                        <span>Selected</span>
                    </div>
 </div>
 </div>
            <div class="graph-info" id="graphInfo">
                <div class="summary-empty">
                    <div class="summary-kicker">Selected Story</div>
                    <p>Click a point to inspect its title, author, series, and summary.</p>
                </div>
            </div>
        </div>

        <!-- Right Panel: Search & Results -->
        <div class="main-panel">
  <header>
    <h1>Shelfscape</h1>
    <p class="subtitle" id="librarySubtitle">Loading stories...</p>
    <button class="settings-toggle-btn" id="settingsToggleBtn" type="button" aria-label="Open settings">⚙️</button>
  </header>

            <div class="search-container">
    <div class="search-box">
      <input type="search" id="searchInput" placeholder="Describe the kind of book you want…  (press / to focus)" aria-label="Search the library by meaning" autocomplete="off">
      <button id="searchBtn" type="button">
        <span class="search-icon">🔍</span>
        <span class="search-text">Search</span>
      </button>
    </div>
    <div class="search-hints">
                    <span>Try:</span>
                    <button class="hint-btn" data-query="a story about dragons and magic">dragons & magic</button>
                    <button class="hint-btn" data-query="romance in a city setting">city romance</button>
                    <button class="hint-btn" data-query="mystery and detective investigation">mystery detective</button>
                    <button class="hint-btn" data-query="space exploration and aliens">space adventure</button>
                    <button class="hint-btn" data-query="dark horror supernatural">horror</button>
                </div>
            </div>

            <div class="progress-container" id="progressContainer" role="status" aria-live="polite">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="progress-text" id="progressText">Analyzing stories...</span>
            </div>

            <div class="stories-grid" id="storiesGrid">
                <!-- Stories will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <!-- Tooltip for graph -->
    <div class="graph-tooltip" id="graphTooltip"></div>

  <!-- Series Modal -->
  <div class="series-modal-backdrop" id="seriesModalBackdrop" aria-hidden="true">
    <div class="series-modal" role="dialog" aria-modal="true" aria-labelledby="seriesModalTitle">
      <div class="series-modal-header">
        <div>
          <div class="series-modal-kicker">Series Details</div>
          <h2 class="series-modal-title" id="seriesModalTitle">Series</h2>
          <div class="series-modal-subtitle" id="seriesModalSubtitle"></div>
        </div>
        <button class="series-modal-close" id="seriesModalClose" type="button" aria-label="Close series details">×</button>
      </div>
      <div class="series-modal-body" id="seriesModalBody"></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="settings-modal-backdrop" id="settingsModalBackdrop" aria-hidden="true">
    <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
      <div class="settings-modal-header">
        <div>
          <div class="settings-modal-kicker">Configuration</div>
          <h2 class="settings-modal-title" id="settingsModalTitle">Settings</h2>
          <div class="settings-modal-subtitle">Adjust performance and display limits</div>
        </div>
        <button class="settings-modal-close" id="settingsModalClose" type="button" aria-label="Close settings">×</button>
      </div>
      <div class="settings-modal-body">
        <label class="settings-field">
          <span class="settings-label">Card limit</span>
          <span class="settings-hint">Max story cards rendered in the grid (lower = faster)</span>
          <input type="number" id="settingMaxCards" class="settings-input" min="10" max="10000" step="10">
        </label>
        <div class="settings-footer">
          <button type="button" class="settings-reset-btn" id="settingsResetBtn">Reset defaults</button>
          <button type="button" class="settings-save-btn" id="settingsSaveBtn">Apply & Refresh</button>
        </div>
      </div>
    </div>
  </div>

    <script src="script.js"></script>
</body>

</html>
